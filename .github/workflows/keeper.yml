name: keeper

# Mirrors Robinhood Chain mainnet Chainlink equity feeds onto the testnet FeedMirrors and settles
# expired series. Runs every 15 minutes; the market is 24/5 so most weekend runs are no-ops.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: dep
        name: check deployment exists
        run: |
          if [ -f contracts/deployments/46630.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "no deployment yet; skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.dep.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.dep.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: keeper/pnpm-lock.yaml
      - if: steps.dep.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: keeper
      - if: steps.dep.outputs.ok == 'true'
        name: mirror feeds
        run: pnpm mirror:once
        working-directory: keeper
        env:
          RELAYER_KEY: ${{ secrets.RELAYER_KEY }}
      - if: steps.dep.outputs.ok == 'true'
        name: settle expired series
        run: pnpm tsx src/settle.ts --once
        working-directory: keeper
        env:
          RELAYER_KEY: ${{ secrets.RELAYER_KEY }}
